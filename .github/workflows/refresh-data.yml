name: Refresh NBA data

on:
  schedule:
    # Mondays 9 AM Central Standard Time (15:00 UTC) — after the weekend's
    # roster moves. Cron is fixed to UTC, so this is 10 AM during daylight
    # time (mid-March to early November).
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # Self-hosted, not ubuntu-latest: 2kratings.com sits behind Cloudflare,
    # which 403s requests from GitHub's hosted-runner (Azure datacenter) IPs
    # regardless of User-Agent. A runner on a residential connection passes.
    # If the runner is offline at the scheduled time the job queues for up
    # to 24h and runs once it comes online.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The scraper exits non-zero on an implausible scrape (site redesign,
      # partial outage), so a bad dataset can never be committed.
      - name: Scrape latest rosters and ratings
        run: npm run fetch:nba

      - name: Verify dataset against the sim's schema
        run: npm test --workspace @perfect-season/sim

      # Windows PowerShell rather than bash: the runner is a Windows PC whose
      # service account only sees the system PATH, which has git but not
      # Git-for-Windows bash. powershell is always present on Windows.
      - name: Commit and push if changed
        shell: powershell
        run: |
          git diff --quiet data/nba-players.json
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No roster changes this week."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nba-players.json
          git commit -m "chore(data): refresh NBA rosters and ratings"
          git push
