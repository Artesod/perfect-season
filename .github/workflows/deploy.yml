# Deploys apps/web to GitHub Pages whenever a version tag (v*) is pushed.
# One-time repo setup: Settings → Pages → Source → "GitHub Actions".
name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write
  # Delete stale Pages artifacts before re-upload (re-runs keep the same run_id).
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GitHub Pages serves the site from /<repo-name>/, so set Vite's base accordingly.
        # Supabase vars are optional: absent secrets build the game in local-only
        # mode (no accounts/leaderboards). Setup: db/README.md
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build --workspace apps/web -- --base "/${{ github.event.repository.name }}/"

      # Re-running this job uploads another artifact named "github-pages" for the
      # same workflow run; deploy-pages then fails with "Artifact count is 2".
      - name: Remove stale Pages artifact from prior attempts
        uses: actions/github-script@v7
        with:
          script: |
            const name = 'github-pages';
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts) {
              if (artifact.name === name) {
                core.info(`Deleting stale artifact ${artifact.id}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
